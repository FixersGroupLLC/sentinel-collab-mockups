<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sentinel Foundation X SavTac: 10 landing page mockups</title>
<style>
html,body{height:100%;margin:0}
body{height:100dvh}
body{display:flex;flex-direction:column;background:#0a0a0b;color:#ececeb;font:14px/1.3 system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px 18px;padding:8px 12px;background:#111213;border-bottom:1px solid #2a2b2c}
header h1{align-self:center;margin:0 6px 0 0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#8e9193;white-space:nowrap}
.grp{display:flex;align-items:center;gap:4px}
.grp>span{margin-right:4px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8e9193;white-space:nowrap}
[role=tab]{padding:7px 12px;border:1px solid #2f3133;border-radius:6px;background:#18191a;color:#c3c5c6;font:600 13px/1 system-ui,sans-serif;cursor:pointer}
[role=tab]:hover{border-color:#5e6163;color:#fff}
[role=tab][aria-selected=true]{background:#4EAAC2;border-color:#4EAAC2;color:#061923}
[role=tab]:focus-visible{outline:2px solid #C6D855;outline-offset:2px}
.info{display:flex;align-items:center;gap:12px;margin-left:auto;font-size:12px;color:#8e9193}
.info a{color:#c3c5c6}
iframe{flex:1;width:100%;border:0;background:#fff}
@media(max-width:700px){
header{gap:4px 12px;padding:6px 10px}
[role=tablist]{display:flex!important;order:3;flex:1 0 100%;gap:12px;overflow-x:auto;scrollbar-width:none}
[role=tablist]::-webkit-scrollbar{display:none}
.grp{flex:none}
[role=tab]{min-width:44px;min-height:44px}
.info{flex:1;min-width:0}
#desc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.info a{display:inline-flex;align-items:center;min-height:44px;white-space:nowrap}
}
iframe{min-height:0}
</style>
</head>
<body>
<header>
  <h1>Sentinel X SavTac</h1>
  <div role="tablist" aria-label="Mockup versions" style="display:contents">
    <div class="grp"><span>V4 Terminal</span><button role="tab" data-v="v4">V4</button></div>
    <div class="grp"><span>V1 Operation file</span><button role="tab" data-v="v1.1">V1.1</button><button role="tab" data-v="v1.2">V1.2</button><button role="tab" data-v="v1.3">V1.3</button></div>
    <div class="grp"><span>V2 Impact first</span><button role="tab" data-v="v2.1">V2.1</button><button role="tab" data-v="v2.2">V2.2</button><button role="tab" data-v="v2.3">V2.3</button></div>
    <div class="grp"><span>V3 Product first</span><button role="tab" data-v="v3.1">V3.1</button><button role="tab" data-v="v3.2">V3.2</button><button role="tab" data-v="v3.3">V3.3</button></div>
  </div>
  <div class="info"><span id="desc"></span><a id="open" href="v4.html" target="_blank" rel="noopener">Open alone</a></div>
</header>
<iframe id="view" title="Mockup preview" src="v4.html"></iframe>
<script>
const DESC={4:'Terminal intro, green-on-black ops look',1:'.1 Original look, SavTac and Sentinel fonts and logos',2:'.2 Sentinel Foundation site style',3:'.3 SavTac x Sentinel blend'};
const tabs=[...document.querySelectorAll('[role=tab]')],view=document.getElementById('view'),open=document.getElementById('open'),desc=document.getElementById('desc');
function show(v,focus){
  const t=tabs.find(b=>b.dataset.v===v)||tabs[0];
  tabs.forEach(b=>{const on=b===t;b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1});
  const url=t.dataset.v+'.html';
  if(!view.src.endsWith(url))view.src=url;
  open.href=url;desc.textContent=DESC[t.dataset.v.slice(-1)];
  if(location.hash!=='#'+t.dataset.v)history.replaceState(null,'','#'+t.dataset.v);
  if(focus)t.focus();else t.scrollIntoView({block:'nearest',inline:'nearest'});
}
function step(d){const i=tabs.findIndex(b=>b.getAttribute('aria-selected')==='true');show(tabs[(i+d+tabs.length)%tabs.length].dataset.v,true)}
tabs.forEach(b=>b.addEventListener('click',()=>show(b.dataset.v)));
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1)});
// ponytail: arrows work while focus is in the viewer bar; a click inside a page sends keys to that page instead (file:// iframes are cross-origin)
addEventListener('hashchange',()=>show(location.hash.slice(1)));
show(location.hash.slice(1));
</script>
</body>
</html>
